name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动发版（Actions 页「Run workflow」或 API，仅限 main）：无需先推 tag——版本取 package.json，create-release 在本次
  # commit 上创建 v<版本> tag 并发布。tag 已存在且指向别的 commit 时 meta 直接失败（绝不把另一份代码挂到已发布版本号下）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 版本号单一来源：tag 触发 = tag 名；手动触发 = package.json（并做 main 分支 / 既有 tag 校验）。
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            if [ "$VERSION" != "$PKG" ]; then
              echo "::warning::tag v$VERSION 与 package.json 版本 $PKG 不一致（安装包文件名按 package.json）"
            fi
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::手动发版只允许在 main 上触发（当前 $GITHUB_REF）"
              exit 1
            fi
            VERSION=$PKG
            # 既有 tag：附注 tag 取 ^{} 解引用后的 commit。指向本次 commit → 视为重跑（补传安装包）；否则拒绝。
            V_RE=${VERSION//./\\.}
            LINES=$(git ls-remote --tags origin | grep -E "refs/tags/v${V_RE}(\^\{\})?$" || true)
            if [ -n "$LINES" ]; then
              SHA=$(echo "$LINES" | awk '$2 ~ /\^\{\}$/ {print $1}')
              [ -n "$SHA" ] || SHA=$(echo "$LINES" | awk '{print $1}' | head -1)
              if [ "$SHA" != "$GITHUB_SHA" ]; then
                echo "::error::tag v$VERSION 已存在且指向 $SHA（非本次 $GITHUB_SHA）——请先升 package.json 版本号"
                exit 1
              fi
            fi
          fi
          echo "Release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: meta
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-14
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      # 提权 helper 二进制不入库（.gitignore），由 build:helper 现编现打：mac(helper/) + win(helper-win/)。
      # 必须在 mac 与 win 两个 runner 都装 Go，否则该平台 package 缺 helper 二进制 → 安装提权助手「二进制缺失」(issue #57)。
      - name: Setup Go (提权 helper, mac + win)
        if: matrix.platform == 'mac' || matrix.platform == 'win'
        uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache: false

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install --no-document fpm

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package application
        run: npm run package:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          REQUIRE_HELPER: "1"
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Create DMG (macOS, arm64 + x64)
        if: matrix.platform == 'mac'
        run: |
          # electron-builder.json mac.target.arch = [arm64, x64] → 两个架构的 .app 都已构建，但
          # 多架构下 electron-builder 会把其中一个架构放进【无后缀】的 dist-package/mac/
          # （v4.1.0 实测：x64 落 dist-package/mac、arm64 落 dist-package/mac-arm64），各自含对应架构的提权 helper。
          # 故此处按 arch 后缀目录优先、回退无后缀目录，并用 lipo 校验确属目标架构；缺则【报错失败】（不再静默跳过，
          # 避免 v4.1.0 那样绿灯却漏发 mac-x64 包）。
          VERSION=${{ needs.meta.outputs.version }}
          for ARCH in arm64 x64; do
            DMG_PATH="dist-package/FlowZ-${VERSION}-mac-${ARCH}.dmg"
            case "$ARCH" in arm64) WANT=arm64 ;; x64) WANT=x86_64 ;; esac
            APP_PATH=""
            for CAND in "dist-package/mac-${ARCH}/FlowZ.app" "dist-package/mac/FlowZ.app"; do
              [ -d "$CAND" ] || continue
              EXE=$(ls "$CAND"/Contents/MacOS/* 2>/dev/null | head -1)
              if [ -n "$EXE" ] && lipo -archs "$EXE" 2>/dev/null | tr ' ' '\n' | grep -qx "$WANT"; then
                APP_PATH="$CAND"; break
              fi
            done
            if [ -z "$APP_PATH" ]; then
              echo "::error::找不到 ${ARCH}(${WANT}) 架构的 FlowZ.app（查了 dist-package/mac-${ARCH}/ 与 dist-package/mac/）——发布将缺 mac-${ARCH} 包，请检查 package:mac 的 electron-builder --${ARCH} 产出。"
              exit 1
            fi
            echo "Using ${ARCH} app bundle: $APP_PATH"
            echo "Ad-hoc deep signing ${ARCH} app bundle (fix Team ID mismatch)..."
            codesign --force --deep --sign - "$APP_PATH"

            echo "Creating ${ARCH} DMG..."
            TEMP_DIR=$(mktemp -d)
            cp -R "$APP_PATH" "$TEMP_DIR/"
            ln -s /Applications "$TEMP_DIR/Applications"
            # ad-hoc 签名（无付费 Developer ID/公证）→ 从下载的 DMG 拖出的 app 带 quarantine，
            # macOS 首次打开报「已损坏，应移到废纸篓」，且右键→打开无效、须 xattr -cr。
            # DMG 内附首次打开引导（中英），教用户清除隔离属性。文件名带序号让它排在 app 前、更显眼。
            cp "build/macos-dmg-open-guide.txt" "$TEMP_DIR/0 首次打开必读 READ ME FIRST.txt"
            hdiutil create -volname "FlowZ ${VERSION} (${ARCH})" \
              -srcfolder "$TEMP_DIR" \
              -ov -format UDZO \
              "$DMG_PATH"
            rm -rf "$TEMP_DIR"
            echo "Created: $DMG_PATH"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist-package/*.exe
            dist-package/*.dmg
            dist-package/*.AppImage
            dist-package/*.deb
          retention-days: 5

  create-release:
    needs: [meta, release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # FlowZX fork 的提交多为直推 main、无 PR，generate_release_notes 只剩一行 Full Changelog。
      # 有 docs/releases/v<版本>.md 时以其为正文（generate_release_notes 的自动部分接在其后）；没有则空正文。
      - name: Prepare release notes
        run: |
          NOTES="docs/releases/v${{ needs.meta.outputs.version }}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" release-notes.md; else : > release-notes.md; fi

      - name: Create GitHub Release
        # 直接发布（非 draft）：tag / 手动发版仅在 main 校验通过后进行，发布前已人工/CI 把关。
        # tag_name + target_commitish：手动发版时 tag 尚不存在，由 Release 在本次 commit 上创建（GITHUB_TOKEN 建的 tag
        # 不会再触发本 workflow，无递归）；tag 触发时二者即现有 tag / 其 commit，行为不变。
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.meta.outputs.version }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
